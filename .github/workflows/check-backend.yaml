name: Check backend

on: [workflow_call]

permissions:
  contents: read

jobs:
  check-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Linting: backend'
            command: uv run --no-project ruff check backend/chainlit/
          - name: 'Formatting: backend'
            command: uv run --no-project ruff format --check backend/chainlit/
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install ruff
        run: uv tool install ruff
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
