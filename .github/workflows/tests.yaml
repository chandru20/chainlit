name: Unit tests

on: [workflow_call]

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    name: python 3.12
    env:
      BACKEND_DIR: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --package chainlit-chandru20 --extra tests --extra custom-data
      - name: Run backend tests
        run: uv run pytest backend/ --ignore=backend/tests/e2e -q
